<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" sizes="64x64">
    <title>KZ | Minecraft Webpanel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        .console-font {
            font-family: 'Consolas', 'Monaco', monospace;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        .setup-bg {
            background: radial-gradient(circle at center, #1f2937 0%, #111827 100%);
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-200 h-screen overflow-hidden font-sans">

    <div id="dashboard-layout" class="flex h-full hidden">

        <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col shadow-2xl z-20">
            <div class="p-6 border-b border-gray-800 flex justify-center items-center">
                <img src="images/logo.png" alt="Logo" class="max-h-32 w-auto max-w-full object-contain"
                    onclick="window.location.reload();">
            </div>

            <nav id="sidebar-menu" class="flex-1 p-4 space-y-2 overflow-y-auto"></nav>

            <div class="p-4 border-t border-gray-800 bg-gray-900/50">
                <a href="https://github.com/KeremZayim" target="_blank"
                    class="flex items-center justify-center gap-2 text-gray-400 hover:text-white transition-colors group p-2 rounded-lg hover:bg-gray-800">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
                    </svg>
                    <span class="text-sm font-bold group-hover:underline">Kerem Zayim</span>
                </a>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative bg-[#0b0d14]">
            <div id="main-content" class="flex-1 p-6 overflow-hidden flex flex-col"></div>
        </main>
    </div>

    <div id="setup-layout" class="hidden fixed inset-0 z-50 setup-bg flex flex-col items-center justify-center p-4">
        <div
            class="max-w-4xl w-full bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-8 relative overflow-hidden">
            <div
                class="absolute top-0 right-0 w-64 h-64 bg-purple-600/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 pointer-events-none">
            </div>

            <div class="text-center mb-10 relative z-10">
                <h1 class="text-4xl font-black text-white mb-2 tracking-tight">HOŞ GELDİNİZ 👋</h1>
                <p class="text-gray-400">Sunucunuz henüz kurulu değil. Başlamak için bir Minecraft sürümü seçin.</p>
            </div>

            <div id="setup-progress-container" class="hidden mb-8">
                <div class="flex justify-between text-xs text-gray-400 mb-2">
                    <span>Kuruluyor...</span>
                    <span id="setup-progress-text">0%</span>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-4 border border-gray-700 overflow-hidden">
                    <div id="setup-progress-bar"
                        class="bg-gradient-to-r from-purple-600 to-blue-500 h-4 rounded-full transition-all duration-300"
                        style="width: 0%"></div>
                </div>
                <p class="text-center text-xs text-gray-500 mt-4 animate-pulse">Lütfen sayfayı kapatmayın, sunucu
                    başlatılacak...</p>
            </div>

            <div class="flex gap-2 mb-6 bg-gray-800/50 p-2 rounded-xl border border-gray-800 shadow-inner">
                <button id="btn-setup-paper" onclick="changeSetupSoftwareType('paper')"
                    class="flex-1 py-2.5 px-4 rounded-lg font-bold text-sm transition bg-purple-600 text-white shadow-md">Paper</button>
                <button id="btn-setup-spigot" onclick="changeSetupSoftwareType('spigot')"
                    class="flex-1 py-2.5 px-4 rounded-lg font-bold text-sm transition bg-gray-950 text-gray-400 hover:bg-gray-800 hover:text-white border border-gray-800/80">Spigot</button>
                <button id="btn-setup-craftbukkit" onclick="changeSetupSoftwareType('craftbukkit')"
                    class="flex-1 py-2.5 px-4 rounded-lg font-bold text-sm transition bg-gray-950 text-gray-400 hover:bg-gray-800 hover:text-white border border-gray-800/80">Bukkit</button>
            </div>

            <div id="setup-version-list"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[400px] overflow-y-auto pr-2">
                <div class="col-span-full text-center py-10">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500 mx-auto"></div>
                    <p class="text-gray-500 mt-2 text-sm">Sürümler Getiriliyor...</p>
                </div>
            </div>
        </div>
        <p class="text-gray-600 text-xs mt-6">Powered by PaperMC API</p>
    </div>

    <!-- ================================================ -->
    <!-- TOAST BİLDİRİM CONTAINER -->
    <!-- ================================================ -->
    <div id="toast-container"
        style="position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none;">
    </div>

    <!-- ================================================ -->
    <!-- CONFIRM MODAL -->
    <!-- ================================================ -->
    <div id="confirm-modal"
        style="display:none;position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);align-items:center;justify-content:center;">
        <div
            style="background:#1a1d2e;border:1px solid #2d3148;border-radius:16px;padding:32px;max-width:420px;width:90%;box-shadow:0 25px 60px rgba(0,0,0,0.6);animation:confirmSlideIn 0.2s ease;">
            <div id="confirm-icon" style="font-size:36px;text-align:center;margin-bottom:12px;"></div>
            <h3 id="confirm-title"
                style="color:#f1f5f9;font-size:16px;font-weight:700;text-align:center;margin:0 0 8px 0;font-family:sans-serif;">
            </h3>
            <p id="confirm-message"
                style="color:#94a3b8;font-size:13px;text-align:center;margin:0 0 24px 0;line-height:1.6;font-family:sans-serif;white-space:pre-line;">
            </p>
            <div style="display:flex;gap:10px;justify-content:center;">
                <button id="confirm-cancel-btn"
                    style="flex:1;padding:10px 20px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#9ca3af;font-size:13px;font-weight:600;cursor:pointer;font-family:sans-serif;transition:all 0.15s;">İptal</button>
                <button id="confirm-ok-btn"
                    style="flex:1;padding:10px 20px;border-radius:8px;border:none;background:#6366f1;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:sans-serif;transition:all 0.15s;">Onayla</button>
            </div>
        </div>
    </div>

    <style>
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(60px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }

            to {
                opacity: 0;
                transform: translateX(60px) scale(0.9);
            }
        }

        @keyframes confirmSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        #confirm-cancel-btn:hover {
            background: #374151;
            color: #fff;
        }

        #confirm-ok-btn:hover {
            filter: brightness(1.15);
        }
    </style>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</body>

</html>
